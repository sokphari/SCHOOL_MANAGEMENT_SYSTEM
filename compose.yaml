name: backend

services:
  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: school_mysql
    restart: unless-stopped
    env_file:
      - ./docker/mysql.env
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - school_mysql_data:/var/lib/mysql

  # Laravel Backend
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      - mysql
    command: >
      sh -c 'if [ ! -f vendor/autoload.php ]; then
        composer install --no-interaction --prefer-dist || exit 1;
      fi;
      php artisan serve --host=0.0.0.0 --port=8000'
    restart: unless-stopped

  # React Frontend
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5176:5173"
    environment:
      VITE_API_URL: http://localhost:8010/api
    command: >
      sh -c "npm install &&
      npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped

volumes:
  school_mysql_data:
  frontend_node_modules: